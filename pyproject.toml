[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pgvector-example"
version = "0.1.0"
description = "Postgres pgvector example — schema, embeddings, similarity search, with offline fallback. — by Viprasol Tech."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Viprasol Tech Private Limited", email = "support@viprasol.com" }]
keywords = [
    "pgvector",
    "postgres",
    "vector-search",
    "embeddings",
    "similarity-search",
    "semantic-search",
    "rag",
    "ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://viprasol.com"
Repository = "https://github.com/Viprasol-Tech/pgvector-example"
Issues = "https://github.com/Viprasol-Tech/pgvector-example/issues"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1", "pgvector>=0.2.5"]
sentence-transformers = ["sentence-transformers>=2.2"]
openai = ["openai>=1.0"]
dev = ["ruff>=0.5", "mypy>=1.10", "pytest>=8.0"]

[project.scripts]
pgvector-example = "pgvector_example.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pgvector_example"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "S", "PTH",
]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unreachable = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "pgvector.*", "psycopg.*", "openai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
